<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Dashboard</h1>
            <button id="mode-toggle">Dark Mode</button>
            <div class="search-bar">
                <input type="text" id="city-input" placeholder="Enter city name..." aria-label="City search input">
                <button id="search-btn" aria-label="Search button">Search</button>
            </div>
        </header>
        <main id="weather-info">
            <p class="loading-state">Search for a city or allow location access to see the weather!</p>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
